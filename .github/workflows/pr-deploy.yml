name: PR DEPLOY

on:
  push:
    branches: [ '**' ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Parse ticket tag from commit message
        id: ticket
        run: |
          MSG=${{ toJSON(github.event.head_commit.message) }}
          if [[ "$MSG" =~ \[Tests\ ([A-Z]+-[0-9]+)\] ]]; then
            echo "id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ticket.outputs.matched == 'true'

      - name: Install build dependencies
        if: steps.ticket.outputs.matched == 'true'
        run: |
          sudo apt-get install -y bmake curl jq

      - name: Build .env
        if: steps.ticket.outputs.matched == 'true'
        run: |
          printf "{{define \"base\"}}/${{ steps.ticket.outputs.id }}{{end}}" > views/base.tmpl

          cat <<- EOF >.env
          	DOMAIN = "${{ vars.DOMAIN }}"
          	WORLD = "${{ vars.WORLD_URL }}"
          	TITLE = "${{ vars.TITLE }}"
          	API_URL = "${{ vars.API_URL }}"
          	STORAGE_URL = "${{ vars.STORAGE_URL }}"
          	MAPBOX_TOKEN = "${{ vars.MAPBOX_TOKEN }}"
          	MAPBOX_THEME = "${{ vars.MAPBOX_THEME }}"
          EOF

      - name: Run make
        if: steps.ticket.outputs.matched == 'true'
        run: |
          bmake deps reconfig build env=test

      - name: Deploy website
        if: steps.ticket.outputs.matched == 'true'
        run: |
          curl -X POST \
            --header "Authorization: Bearer ${{ secrets.PR_DEPLOY_TOKEN }}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\": \"trigger-workflow\", \"client_payload\": {\"branch_name\": \"trunk\", \"destination\": \"${{ steps.ticket.outputs.id }}\"}}" \
            https://api.github.com/repos/energyaccessexplorer/website/dispatches

      - name: Make destination directory
        if: steps.ticket.outputs.matched == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host:     ${{ secrets.PR_DEPLOY_HOST }}
          username: ${{ secrets.PR_DEPLOY_USER }}
          port:     ${{ secrets.PR_DEPLOY_PORT }}
          key:      ${{ secrets.PR_DEPLOY_KEY }}
          script:   |
            mkdir -p ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/stylesheets  ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/stylesheets
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/images        ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/images
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/javascripts   ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/javascripts
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/lib           ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/lib

      - name: Deploy the thing
        if: steps.ticket.outputs.matched == 'true'
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: --recursive --verbose
          path: dist/
          remote_path: ${{ secrets.PR_DEPLOY_PATH }}/${{ steps.ticket.outputs.id }}/tool/
          remote_host: ${{ secrets.PR_DEPLOY_HOST }}
          remote_port: ${{ secrets.PR_DEPLOY_PORT }}
          remote_user: ${{ secrets.PR_DEPLOY_USER }}
          remote_key:  ${{ secrets.PR_DEPLOY_KEY }}
