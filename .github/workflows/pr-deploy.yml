name: COMMIT DEPLOY

on:
  push:
    branches: [ '**', '!trunk', '!production' ]

jobs:
  tickets:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.parse.outputs.ids }}

    steps:
      - name: Parse ticket tags from commit message
        id: parse
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          ids=$( { grep -oE '\[Tests [A-Z]+-[0-9]+\]' <<< "$MSG" || true; } \
            | sed -E 's/^\[Tests (.*)\]$/\1/' | sort -u | jq -R . | jq -cs .)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: tickets
    if: needs.tickets.outputs.ids != '[]'
    runs-on: ubuntu-latest

    # The ticket is baked into the build's base path: one build per ticket.
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.tickets.outputs.ids) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get install -y bmake curl jq
          sudo npm install -g typescript@5.9.3

      - name: Merge ${{ github.event.repository.default_branch }} before building
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "eae-ci"
          git config user.email "ci@energyaccessexplorer.org"
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git merge --no-edit "origin/$BASE"
          test "$(git rev-list --count HEAD..origin/$BASE)" = "0"

      - name: Build .env
        run: |
          printf "{{define \"base\"}}/${{ matrix.id }}{{end}}" > views/base.tmpl

          cat <<- EOF >.env
          	DOMAIN = "${{ vars.DOMAIN }}"
          	WORLD = "${{ vars.WORLD_URL }}"
          	TITLE = "${{ vars.TITLE }}"
          	API_URL = "${{ vars.API_URL }}"
          	STORAGE_URL = "${{ vars.STORAGE_URL }}"
          	MAPBOX_TOKEN = "${{ vars.MAPBOX_TOKEN }}"
          	MAPBOX_THEME = "${{ vars.MAPBOX_THEME }}"
          EOF

      - name: Run make
        run: |
          bmake deps reconfig build env=test

      - name: Make destination directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host:     ${{ secrets.PR_DEPLOY_HOST }}
          username: ${{ secrets.PR_DEPLOY_USER }}
          port:     ${{ secrets.PR_DEPLOY_PORT }}
          key:      ${{ secrets.PR_DEPLOY_KEY }}
          script:   |
            mkdir -p ${{ secrets.PR_DEPLOY_PATH }}/${{ matrix.id }}

      - name: Deploy the thing
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: --recursive --verbose
          path: dist/
          remote_path: ${{ secrets.PR_DEPLOY_PATH }}/${{ matrix.id }}/tool/
          remote_host: ${{ secrets.PR_DEPLOY_HOST }}
          remote_port: ${{ secrets.PR_DEPLOY_PORT }}
          remote_user: ${{ secrets.PR_DEPLOY_USER }}
          remote_key:  ${{ secrets.PR_DEPLOY_KEY }}
