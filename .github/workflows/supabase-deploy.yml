# Deploys to Supabase, alongside the self-hosted deploy workflows.
name: SUPABASE DEPLOY

on:
  push:
    branches: [ production ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: production

      - name: Install build dependencies
        run: |
          sudo apt-get install -y bmake curl jq awscli

      - name: Build .env
        run: |
          echo '{{define "base"}}{{end}}' > views/base.tmpl

          cat <<- EOF >.env
          	DOMAIN       = "${{ vars.DOMAIN }}"
          	WORLD        = "${{ vars.WORLD_URL }}"
          	TITLE        = "${{ vars.TITLE }}"
          	API_URL      = "${{ vars.API_URL }}"
          	STORAGE_URL  = "${{ vars.STORAGE_URL }}"
          	MAPBOX_TOKEN = "${{ vars.MAPBOX_TOKEN }}"
          	MAPBOX_THEME = "${{ vars.MAPBOX_THEME }}"
          EOF

      - name: Build
        run: |
          bmake deps reconfig build env=production

      - name: Deploy to Supabase Storage
        run: |
          aws s3 sync dist/ "s3://${{ vars.SUPABASE_BUCKET }}/production/tool/" \
            --endpoint-url "https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/storage/v1/s3" \
            --delete
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.SUPABASE_STORAGE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET }}
          AWS_DEFAULT_REGION:    us-east-1
