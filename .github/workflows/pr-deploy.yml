name: PR DEPLOY

on:
  pull_request:
    branches: [ trunk ]

  repository_dispatch:
    types: [ trigger-workflow ]

env:
  BRANCH_NAME: ${{ github.event.client_payload.branch_name || github.head_ref || github.ref_name }}
  DESTINATION: ${{ github.event.client_payload.destination || github.head_ref || github.ref_name }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Install build dependencies
        run: |
          sudo apt-get install -y bmake curl jq

      - name: Build .env
        run: |
          printf "{{define \"base\"}}/${{ env.DESTINATION }}{{end}}" > views/base.tmpl

          cat <<- EOF >.env
          	DOMAIN = "${{ vars.DOMAIN }}"
          	WORLD = "${{ vars.WORLD_URL }}"
          	TITLE = "${{ vars.TITLE }}"
          	API_URL = "${{ vars.API_URL }}"
          	STORAGE_URL = "${{ vars.STORAGE_URL }}"
          	MAPBOX_TOKEN = "${{ vars.MAPBOX_TOKEN }}"
          	MAPBOX_THEME = "${{ vars.MAPBOX_THEME }}"
          EOF

      - name: Run make
        run: |
          bmake deps reconfig build env=test

      - name: Deploy website
        run: |
          curl -X POST \
            --header "Authorization: Bearer ${{ secrets.PR_DEPLOY_TOKEN }}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\": \"trigger-workflow\", \"client_payload\": {\"branch_name\": \"trunk\", \"destination\": \"$DESTINATION\"}}" \
            https://api.github.com/repos/energyaccessexplorer/website/dispatches

      - name: Make destination directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host:     ${{ secrets.PR_DEPLOY_HOST }}
          username: ${{ secrets.PR_DEPLOY_USER }}
          port:     ${{ secrets.PR_DEPLOY_PORT }}
          key:      ${{ secrets.PR_DEPLOY_KEY }}
          script:   |
            mkdir -p ${{ secrets.PR_DEPLOY_PATH }}/${{ env.DESTINATION }}
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/stylesheets  ${{ secrets.PR_DEPLOY_PATH }}/${{ env.DESTINATION }}/stylesheets
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/images        ${{ secrets.PR_DEPLOY_PATH }}/${{ env.DESTINATION }}/images
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/javascripts   ${{ secrets.PR_DEPLOY_PATH }}/${{ env.DESTINATION }}/javascripts
            ln -sfn ${{ secrets.PR_DEPLOY_PATH }}/trunk/lib           ${{ secrets.PR_DEPLOY_PATH }}/${{ env.DESTINATION }}/lib

      - name: Deploy the thing
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: --recursive --verbose
          path: dist/
          remote_path: ${{ secrets.PR_DEPLOY_PATH }}/$DESTINATION/tool/
          remote_host: ${{ secrets.PR_DEPLOY_HOST }}
          remote_port: ${{ secrets.PR_DEPLOY_PORT }}
          remote_user: ${{ secrets.PR_DEPLOY_USER }}
          remote_key:  ${{ secrets.PR_DEPLOY_KEY }}
